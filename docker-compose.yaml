services:
  db:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  fastapi:
    build: ./ml
    env_file: .env
    environment:
      # можно явно продублировать важные, чтобы было понятно, что они используются
      LLM_PROVIDER: ${LLM_PROVIDER}
      GIGACHAT_API_KEY: ${GIGACHAT_API_KEY}
      USE_GPU_RERANKER: ${USE_GPU_RERANKER}
      RERANKER_CANDIDATES: ${RERANKER_CANDIDATES}
      RERANKER_BATCH_SIZE: ${RERANKER_BATCH_SIZE}
      USE_METADATA_FILTER: ${USE_METADATA_FILTER}
      USE_QUERY_EXPANSION: ${USE_QUERY_EXPANSION}
      CHROMA_PERSIST_DIR: ${CHROMA_PERSIST_DIR}
      MODELS_CACHE_DIR: ${MODELS_CACHE_DIR}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "8000:8000"
    volumes:
      - fastapi_indices:/app/indices
      - fastapi_models:/app/models_cache
    # GPU (если нужно):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  backend:
    build: ./backend
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      FASTAPI_URL: ${FASTAPI_URL}
      FASTAPI_CHECK_PATH: ${FASTAPI_CHECK_PATH}
    ports:
      - "8080:8080"
    depends_on:
      - db
      - fastapi

  frontend:
    build:
      context: ./frontend
      # Для Vite переменные часто нужны на этапе запуска dev-сервера/сборки
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    env_file: .env
    environment:
      # Если у тебя Vite dev server в контейнере, ему тоже это может понадобиться при старте
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  fastapi_indices:
  fastapi_models:
